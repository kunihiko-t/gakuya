<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gakuya</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <strong>gakuya</strong>
  <span id="review-name"></span>
  <span id="version-label"></span>
  <span id="frame-no"></span>
  <span class="spacer"></span>
  <label id="compare-area"><span id="compare-label"></span> <select id="compare-pick"></select></label>
</header>
<div id="reference-bar" hidden>
  <label>見本の動画のパス（サーバーが動いているこの PC の絶対パス） <input id="ref-path" type="text" spellcheck="false"></label>
  <label>ズレ <input id="ref-offset" type="number" step="0.01" value="0"> 秒</label>
  <span id="ref-error" class="error"></span>
</div>
<main id="stage">
  <div id="panes">
    <div id="left" class="pane"></div>
    <div id="right" class="pane" hidden></div>
  </div>
  <aside id="side"></aside>
</main>
<section id="timeline">
  <div id="timing">
    <button id="play" type="button"></button>
    <button id="fit" type="button" title="キーボードの 0 でも戻せます" disabled>全体を表示</button>
    <label>BPM <input id="bpm" type="number" min="1" step="0.01"></label>
    <label>開始位置 <input id="offset" type="number" step="0.01"> 秒</label>
    <label><input id="flash-toggle" type="checkbox" checked> ふちを光らせる</label>
    <span class="legend beat">基準（拍）</span>
    <span class="legend motion">実際の動き</span>
    <span id="timing-status"></span>
  </div>
</section>
<script src="/main.js"></script>
</body>
</html>
